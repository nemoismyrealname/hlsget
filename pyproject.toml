[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hlsget"
version = "0.1.0"
description = "Small concurrent HLS downloader with a friendly CLI"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["hls", "m3u8", "video", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "httpx>=0.27,<1",
  "m3u8>=6,<7",
  "rich>=13,<15",
  "typer>=0.12,<1",
]

[project.scripts]
hlsget = "hlsget.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/hlsget"]
